[project]
name = "cism"
version = "0.1.0"
description = "Cyber Investigation State Memory — SLM-driven VAPT agent, terminal surface"
requires-python = ">=3.11"
dependencies = ["textual>=8.0"]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-textual-snapshot>=1.0",
    "pytest-xdist>=3.6",
    "textual-dev>=1.7",
    "ruff>=0.6",
    "mypy>=1.11",
]
agent = [
    "langgraph>=0.2",
    "langchain-core>=0.3",
    "langchain-openai>=0.2",
    "pyyaml>=6.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["cism*"]

[tool.setuptools.package-data]
"cism.tui" = ["*.tcss"]
"cism.agent.tools" = ["*.yaml"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["error::DeprecationWarning:cism.*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true
