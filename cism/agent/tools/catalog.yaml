# Every tool used by the agent is declared here: how to run it (binary,
# flags, target, allow_raw), and which phases offer it (phases: — omit to
# use the capability default below).
#
# Capability defaults when `phases:` is omitted:
#   reads                        -> recon, enumeration, vulnerability-discovery
#   writes / executes / destructive -> NONE — registered but unreachable in
#                                      every phase until you add an explicit
#                                      `phases:` key. This is deliberate,
#                                      fail-closed behavior: a destructive
#                                      tool should never become available to
#                                      a phase just because nobody thought
#                                      about it.

nikto:
  binary: nikto
  capability: reads
  description: >-
    Web server vulnerability scan. Self-limited to 45s of testing per host
    automatically, so it always returns real findings instead of running
    past the sandbox timeout and getting killed with nothing to show.
  target: "-host"
  forced_flags: ["-maxtime", "45s"]
  timeout: 75.0

whatweb:
  binary: whatweb
  capability: reads
  description: Fingerprint web technologies in use on a target.

dnsenum:
  binary: dnsenum
  capability: reads
  description: Enumerate DNS records and subdomains for a domain.

nmap:
  binary: nmap
  capability: reads
  description: >-
    Network/port scan. -sT -Pn (TCP connect scan, skip host discovery) is
    always applied automatically — the sandbox has no raw-socket privilege,
    so the default SYN scan / ping discovery would fail. Use extra for
    anything else (e.g. "-p 1-1000", "-sV").
  forced_flags: ["-sT", "-Pn"]
  allow_raw: true
  # The 60s ToolSpec default (below) is only enough for a plain connect
  # scan. -sV against a host with many open services probes each one in
  # turn for a banner/response — confirmed live 2026-10-18: a bare
  # "nmap -sT -Pn -sV" against a 14-open-port host (Metasploitable2) took
  # 152.82s and was killed at 60s on every attempt, so the agent could
  # never version-scan a busy host at all. 240s covers that with margin.
  timeout: 240.0
  # Explicit override, not the reads-only default above: nmap was already
  # offered in every non-reporting phase before this migration (the old
  # hand-written PhaseProfile._TOOLS table in cism/agent/profiles.py) —
  # this preserves that. See the design doc §10 (Migration).
  phases: [recon, enumeration, vulnerability-discovery, exploitation, post-exploitation]

curl:
  binary: curl
  capability: reads
  description: >-
    Fetch one specific, already-known URL and return its response — for
    checking a single page/header/redirect you already have the path for.
    Not for discovering unknown paths or brute-forcing directories one
    guess at a time; use gobuster for that instead. Confirmed live
    2026-10-12: asked to brute-force directories, the model called curl
    against a single guessed path instead of gobuster.
  allow_raw: true
  # D7: without this, "curl file:///etc/passwd" is a live local-file read
  # through a tool the model thinks only hits the network.
  forced_flags: ["--proto", "-all,+http,+https"]
  phases: [recon, enumeration, vulnerability-discovery, exploitation, post-exploitation]

# §4.1 (BACKLOG.md): next tools picked by target-type gap against DVWA —
# sqlmap for SQLi coverage, gobuster for directory/endpoint discovery that
# nikto only partially covers.

sqlmap:
  binary: sqlmap
  capability: executes
  description: >-
    Test a URL for SQL injection and, if found, enumerate what's behind it.
    --batch makes every prompt take sqlmap's own default answer instead of
    hanging on stdin (there is no interactive session to answer it here).
    --forms/--crawl=2 are forced because the target URL is usually a page
    that hosts a POST login form rather than a GET ?id=1-style parameter —
    without them sqlmap finds nothing to test on a bare URL like
    http://host/login.php and exits with "no parameter(s) found for
    testing" while still reporting the call as a success. Confirmed live
    2026-10-12 against DVWA's login form: a bare sqlmap call tested
    literally nothing. Harmless to add when the URL does have its own
    GET parameter — sqlmap still tests that too, it just also crawls.
  target: "-u"
  forced_flags: ["--batch", "--forms", "--crawl=2"]
  allow_raw: true
  timeout: 90.0
  # Explicit, like nmap/curl: this is an active-exploitation-capable tool,
  # not a passive read — it should never fall under the reads-only default.
  phases: [enumeration, vulnerability-discovery, exploitation]

gobuster:
  binary: gobuster
  capability: reads
  description: >-
    Brute-force a web server's directories/files from a wordlist. "dir"
    mode and a real wordlist are already forced — never add your own -w,
    -e, or any other wordlist/output flag in `extra`; the call needs
    nothing beyond the target. gobuster also has vhost/dns/s3/etc. modes
    this catalog row doesn't support.
  target: "-u"
  # -z: gobuster's live progress indicator rewrites the current line with
  # a raw \r + ANSI clear-line before every hit it prints — confirmed live
  # against DVWA 2026-10-12 to desync the extractor's ^-anchored regex
  # from real content on the same "line". GobusterExtractor now strips
  # that noise before matching regardless, but suppressing it at the
  # source means there's nothing to strip in the first place.
  forced_flags: ["dir", "-w", "/usr/share/wordlists/common-dirs.txt", "-z"]
  allow_raw: true
  timeout: 60.0

# Picked from the awesome-cyber-security-tools list against a target-type
# gap, same as sqlmap/gobuster above: everything else on that list either
# needs live internet + a real registered domain (theHarvester, Sublist3r,
# WHOIS, dnsrecon) — useless against an isolated lab IP like the DVWA/Juice
# Shop targets this agent actually runs against — or is too heavy to wire
# into one sandboxed CLI call (Burp, ZAP, Metasploit). wafw00f is the one
# that fits: apt-packaged, one-shot, deterministic JSON output.
wafw00f:
  binary: wafw00f
  capability: reads
  description: >-
    Fingerprint whether a web application firewall sits in front of the
    target, and which one. Forced to JSON-on-stdout so the extractor never
    has to parse wafw00f's own dynamically-column-padded text table.
  target: positional
  # wafw00f takes a URL and defaults to https when given a bare host —
  # confirmed live against DVWA 2026-10-12: it tried port 443, got
  # connection refused, and reported nothing, even though port 80 was
  # open and serving. default_scheme fixes the blind-default case without
  # overriding a model that already knows the real scheme (e.g. after
  # nmap reported 443 open).
  default_scheme: http
  forced_flags: ["-f", "json", "-o", "-"]
  allow_raw: false
  timeout: 45.0
